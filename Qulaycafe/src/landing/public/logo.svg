<!-- The QulayCafe brand mark: the same cup glyph components/site/logo.tsx draws
     in the header, on the same green disc, as a standalone file.

     Why a file and not just the React component: Google (and Telegram, and
     iOS) can only take a logo as an image at a URL — the mark has to exist
     outside the bundle for the Organization structured data in index.html, for
     the favicon shown next to a search result, and for the home-screen icon.

     Colours are baked in on purpose. The file this replaced switched fill with
     prefers-color-scheme, which a crawler resolves to whichever scheme it
     happens to render in; the brand green (the primary token in styles.css,
     oklch(0.53 0.088 158)) and its cream foreground are written out as hex so
     every consumer gets the same mark.

     Geometry: the glyph's stroked bounding box in the 24x24 source is
     x 4.15..19.35, y 2.65..18.85, so it is scaled 16.4x and translated to put
     that box's centre — not the viewBox's — at 256,256. Optical centring, the
     glyph is not centred in its own viewBox.

     scripts/generate-brand-icons.py rasterises this into the PNG sizes. -->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QulayCafe">
  <circle cx="256" cy="256" r="256" fill="#397b58" />
  <g transform="translate(63.3 79.7) scale(16.4)" stroke="#fcfaf6" stroke-width="1.7" fill="none">
    <path d="M5 10h11v3a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5v-3Z" stroke-linejoin="round" />
    <path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16" stroke-linecap="round" />
    <path d="M9.5 6.5c0-1.2 1-1.8 1-3M12.5 6.5c0-1.2 1-1.8 1-3" stroke-linecap="round" />
  </g>
</svg>
